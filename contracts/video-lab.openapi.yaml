openapi: 3.1.0
info:
  title: Intelligensi.ai Video Lab API
  version: 0.1.0
  description: OpenAPI-first public API for authenticated AI video generation.
servers:
  - url: /api
security:
  - bearerAuth: []
paths:
  /v1/health:
    get:
      security: []
      operationId: getHealth
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Health'}}}}
  /v1/me:
    get:
      operationId: getMe
      responses:
        '200': {description: Me, content: {application/json: {schema: {$ref: '#/components/schemas/Me'}}}}
  /v1/credits:
    get:
      operationId: getCredits
      responses:
        '200': {description: Credits, content: {application/json: {schema: {$ref: '#/components/schemas/CreditWallet'}}}}
  /v1/assets/upload-url:
    post:
      operationId: createUploadUrl
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateUploadUrlRequest'}}}}
      responses:
        '201': {description: Upload target, content: {application/json: {schema: {$ref: '#/components/schemas/CreateUploadUrlResponse'}}}}
  /v1/generations:
    post:
      operationId: createGeneration
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 8, maxLength: 128}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateGenerationRequest'}}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Generation'}}}}
        '200': {description: Idempotent replay, content: {application/json: {schema: {$ref: '#/components/schemas/Generation'}}}}
  /v1/generations/{generationId}:
    get:
      operationId: getGeneration
      parameters: [{$ref: '#/components/parameters/generationId'}]
      responses:
        '200': {description: Generation, content: {application/json: {schema: {$ref: '#/components/schemas/Generation'}}}}
  /v1/generations/{generationId}/cancel:
    post:
      operationId: cancelGeneration
      parameters: [{$ref: '#/components/parameters/generationId'}]
      responses:
        '200': {description: Cancelled, content: {application/json: {schema: {$ref: '#/components/schemas/Generation'}}}}
  /v1/gallery:
    get:
      operationId: listGallery
      parameters:
        - {name: cursor, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/GenerationStatus'}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
      responses:
        '200': {description: Gallery, content: {application/json: {schema: {$ref: '#/components/schemas/GalleryPage'}}}}
  /v1/runtime/status:
    get:
      operationId: getRuntimeStatus
      responses:
        '200': {description: Runtime, content: {application/json: {schema: {$ref: '#/components/schemas/RuntimeStatus'}}}}
  /v1/admin/runtime/pause:
    post:
      operationId: pauseRuntime
      responses: {'200': {description: Runtime, content: {application/json: {schema: {$ref: '#/components/schemas/RuntimeStatus'}}}}}
  /v1/admin/runtime/connect:
    post:
      operationId: connectRuntime
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RuntimeConnectRequest'}}}}
      responses:
        '200': {description: Runtime connected, content: {application/json: {schema: {$ref: '#/components/schemas/RuntimeConnectResponse'}}}}
  /v1/admin/runtime/resume:
    post:
      operationId: resumeRuntime
      responses: {'200': {description: Runtime, content: {application/json: {schema: {$ref: '#/components/schemas/RuntimeStatus'}}}}}
  /v1/admin/runtime/stop:
    post:
      operationId: stopRuntime
      responses: {'200': {description: Runtime, content: {application/json: {schema: {$ref: '#/components/schemas/RuntimeStatus'}}}}}
  /v1/admin/credits/adjust:
    post:
      operationId: adjustCredits
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AdminCreditAdjustment'}}}}
      responses: {'200': {description: Credits, content: {application/json: {schema: {$ref: '#/components/schemas/CreditWallet'}}}}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: Firebase ID token}
  parameters:
    generationId: {name: generationId, in: path, required: true, schema: {type: string}}
  schemas:
    Health: {type: object, required: [ok, service, version], properties: {ok: {type: boolean}, service: {type: string}, version: {type: string}}}
    RuntimeHealth: {type: object, required: [ok, provider], properties: {ok: {type: boolean}, provider: {type: string}, message: {type: string}}}
    RuntimeConnectRequest: {type: object, properties: {lambdaIp: {type: string}, baseUrl: {type: string}}}
    RuntimeConnectResponse:
      allOf:
        - {$ref: '#/components/schemas/RuntimeStatus'}
        - {type: object, required: [baseUrl], properties: {baseUrl: {type: string}, health: {$ref: '#/components/schemas/RuntimeHealth'}}}
    GenerationStatus: {type: string, enum: [queued, preparing, generating, uploading, completed, failed, cancelled]}
    VideoSettings: {type: object, required: [aspectRatio, durationSeconds, quality], properties: {aspectRatio: {type: string, enum: ['16:9','9:16','1:1']}, durationSeconds: {type: integer, enum: [4,8,12]}, quality: {type: string, enum: [draft, standard, high]}, seed: {type: integer, minimum: 0}}}
    AssetPurpose: {type: string, enum: [start_frame, end_frame, reference]}
    CreateUploadUrlRequest: {type: object, required: [fileName, contentType, sizeBytes, purpose], properties: {fileName: {type: string, maxLength: 160}, contentType: {type: string, enum: [image/jpeg,image/png,image/webp]}, sizeBytes: {type: integer, minimum: 1, maximum: 10485760}, purpose: {$ref: '#/components/schemas/AssetPurpose'}}}
    CreateUploadUrlResponse: {type: object, required: [assetId, uploadUrl, method, expiresAt, objectPath], properties: {assetId: {type: string}, uploadUrl: {type: string}, method: {type: string, enum: [PUT]}, expiresAt: {type: string, format: date-time}, objectPath: {type: string}}}
    CreateGenerationRequest: {type: object, required: [prompt, settings], properties: {prompt: {type: string, minLength: 8, maxLength: 1200}, settings: {$ref: '#/components/schemas/VideoSettings'}, inputAssets: {type: array, maxItems: 3, items: {type: object, required: [assetId, purpose], properties: {assetId: {type: string}, purpose: {$ref: '#/components/schemas/AssetPurpose'}}}}}}
    Generation: {type: object, required: [id, prompt, settings, status, creditCost, createdAt, updatedAt], properties: {id: {type: string}, prompt: {type: string}, settings: {$ref: '#/components/schemas/VideoSettings'}, inputAssets: {type: array, items: {type: object}}, status: {$ref: '#/components/schemas/GenerationStatus'}, queuePosition: {type: integer}, creditCost: {type: integer}, output: {type: object, properties: {downloadUrl: {type: string}, thumbnailUrl: {type: string}, durationSeconds: {type: integer}}}, safeErrorMessage: {type: string}, createdAt: {type: string, format: date-time}, updatedAt: {type: string, format: date-time}}}
    GalleryPage: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/Generation'}}, nextCursor: {type: string}}}
    Me: {type: object, required: [uid, email, status, roles, termsVersion], properties: {uid: {type: string}, email: {type: string}, displayName: {type: string}, photoURL: {type: string}, status: {type: string, enum: [active, suspended]}, roles: {type: array, items: {type: string}}, termsVersion: {type: string}, trialGrantedAt: {type: string, format: date-time}}}
    CreditWallet: {type: object, required: [uid, available, reserved, spent, updatedAt, version], properties: {uid: {type: string}, available: {type: integer}, reserved: {type: integer}, spent: {type: integer}, updatedAt: {type: string, format: date-time}, version: {type: integer}}}
    RuntimeStatus: {type: object, required: [provider, status, acceptingSubmissions, killSwitch, queueDepth, updatedAt], properties: {provider: {type: string}, status: {type: string, enum: [healthy, degraded, unavailable, paused]}, acceptingSubmissions: {type: boolean}, killSwitch: {type: boolean}, lastHeartbeatAt: {type: string, format: date-time}, activeGenerationId: {type: string}, queueDepth: {type: integer}, updatedAt: {type: string, format: date-time}}}
    AdminCreditAdjustment: {type: object, required: [uid, amount, reason], properties: {uid: {type: string}, amount: {type: integer}, reason: {type: string, minLength: 3}}}
    Problem: {type: object, required: [type, title, status, detail, code, traceId], properties: {type: {type: string}, title: {type: string}, status: {type: integer}, detail: {type: string}, code: {type: string}, traceId: {type: string}, fieldErrors: {type: array, items: {type: object}}}}
